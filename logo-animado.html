<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Canarias Convive — Logo animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Manrope:wght@600&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#e8e6e0;display:grid;place-items:center;overflow:hidden;}
  #frame{width:700px;height:700px;flex:none;position:relative;}

  /* ── isla SVG ── */
  .cc-islands{position:absolute;inset:0;}
  .cc-islands path{fill:#d3d8bd;stroke:#b6be97;stroke-width:1.4;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;}
  .cc-map{position:absolute;inset:0;transform:translateY(-16px) scale(1.12);transform-origin:50% 50%;}

  /* ── textos ── */
  .cc-kick{position:absolute;top:74px;left:0;right:0;text-align:center;
    font-family:'Manrope',sans-serif;font-size:14px;letter-spacing:.46em;
    text-transform:uppercase;color:#a7a597;font-weight:600;}
  .cc-mark{position:absolute;top:498px;left:0;right:0;text-align:center;
    font-family:'Quicksand',sans-serif;font-weight:600;font-size:54px;letter-spacing:.01em;color:#33322e;}
  .cc-rule{position:absolute;top:488px;left:50%;width:50px;height:2px;margin-left:-25px;background:#f55654;}
  .cc-tag{position:absolute;top:568px;left:0;right:0;text-align:center;
    font-family:'Manrope',sans-serif;font-size:13px;letter-spacing:.26em;
    text-transform:uppercase;color:#0d4e47;font-weight:600;}

  /* ── puntos ── */
  .cc-dot{position:absolute;border-radius:50%;
    box-shadow:0 4px 10px -4px #00000055, 0 0 0 2px #fdfcfaf2;}

  /* ── animaciones ── */
  @media (prefers-reduced-motion: no-preference){
    .cc-islands path{opacity:0;animation:ccRise 1.1s ease both;}
    .cc-kick{opacity:0;animation:ccFade 1s .2s ease both;}
    .cc-dot{animation:ccPop .9s cubic-bezier(.2,.9,.25,1.1) both,
                       ccFloat var(--d) ease-in-out infinite;}
    .cc-mark{opacity:0;animation:ccFade 1.1s 1.2s ease both;}
    .cc-rule{transform:scaleX(0);transform-origin:center;animation:ccRule .8s 1.45s cubic-bezier(.2,.9,.25,1) both;}
    .cc-tag{opacity:0;animation:ccFade 1s 1.5s ease both;}
  }
  @keyframes ccPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  @keyframes ccFloat{0%,100%{transform:translateY(calc(var(--a)*-1))}50%{transform:translateY(var(--a))}}
  @keyframes ccFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes ccRule{to{transform:scaleX(1)}}
  @keyframes ccRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* responsive */
  #frame-wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
</style>
</head>

<script>
// Configuracion de islas: posicion (cx,cy) en el canvas 700x700, color corporativo.
// El radio se calcula a partir del count real del geojson; el fallback son los
// valores actuales para que se vea bien aunque la red no responda.
var ISLANDS_CFG = [
  {id:'palma',   cx:94.9,  cy:291,   color:'#b15265', fallback:4  },
  {id:'gomera',  cx:172.1, cy:361.7, color:'#4a4944', fallback:3  },
  {id:'hierro',  cx:76.4,  cy:407.5, color:'#a99c81', fallback:1  },
  {id:'tfe',     cx:256,   cy:339.9, color:'#0d4e47', fallback:108},
  {id:'gc',      cx:374.9, cy:381.5, color:'#f55654', fallback:82 },
  {id:'fuerte',  cx:566.6, cy:326.5, color:'#979c30', fallback:18 },
  {id:'lz',      cx:615.9, cy:249.8, color:'#726d4c', fallback:18 },
];

// Mapeo nombre de isla (campo del geojson) → id de config
var ISLAND_MAP = {
  'La Palma':'palma','La Gomera':'gomera','El Hierro':'hierro',
  'Tenerife':'tfe','Gran Canaria':'gc','Fuerteventura':'fuerte','Lanzarote':'lz'
};

function renderDots(counts) {
  var wrap = document.getElementById('cc-dots');
  wrap.innerHTML = '';
  ISLANDS_CFG.forEach(function(is, idx) {
    var count = (counts && counts[is.id] != null) ? counts[is.id] : is.fallback;
    var rd = 2.5 + Math.sqrt(count) * 0.7;
    var d = document.createElement('div');
    d.className = 'cc-dot';
    d.style.cssText = [
      'left:'+(is.cx - rd)+'px',
      'top:'+(is.cy - rd)+'px',
      'width:'+(rd*2)+'px',
      'height:'+(rd*2)+'px',
      'background:'+is.color,
      'animation-delay:'+(idx*80)+'ms, '+(560+idx*80)+'ms',
      '--d:'+(5.2+idx*0.55)+'s',
      '--a:'+(2+rd*0.12)+'px',
    ].join(';');
    wrap.appendChild(d);
  });
}

// Carga conteos reales del geojson (GitHub Pages). Si falla, usa fallbacks.
(function() {
  renderDots(null); // fallback inmediato para que no haya retraso visual
  var GEO = 'https://diegoalegil.github.io/canariasconvive-mapa/entities.geojson';
  fetch(GEO)
    .then(function(r){ return r.json(); })
    .then(function(geo) {
      var counts = {};
      (geo.features || []).forEach(function(f) {
        var isla = (f.properties || {}).island || '';
        var id = ISLAND_MAP[isla];
        if (id) counts[id] = (counts[id] || 0) + 1;
      });
      renderDots(counts);
    })
    .catch(function() { /* mantiene los fallbacks ya pintados */ });
})();

// Escala el frame al viewport
function fit() {
  var s = Math.min(window.innerWidth / 700, window.innerHeight / 700);
  document.getElementById('frame').style.transform = 'scale('+s+')';
  document.getElementById('frame').style.transformOrigin = 'center center';
}
window.addEventListener('resize', fit);
fit();
</script>
