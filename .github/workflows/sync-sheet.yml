name: Sync Sheet → entities.geojson

# Lee el Google Sheet "Canarias Convive" (carpeta Mapas en la unidad compartida)
# y regenera entities.geojson. Si hay cambios respecto a lo que está en git,
# commitea. Así el Sheet es la fuente de verdad editable por humanos y el mapa
# (que carga entities.geojson) refleja los cambios en la siguiente ejecución.

on:
  schedule:
    # Cada hora en punto. Bajar a '*/15 * * * *' si se quiere más reactivo.
    - cron: '0 * * * *'
  workflow_dispatch:

# Necesario para que el job pueda commitear el geojson regenerado.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Google
        run: pip install --quiet google-auth google-api-python-client

      - name: Generar entities.geojson desde el Sheet
        env:
          # JSON del service account. Se añade en Settings → Secrets and
          # variables → Actions → New repository secret. Nunca se commitea.
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: '1d1C7lq26yGNujCa342oNf1uemxtjJErR_sgBQwqNUMo'
        shell: python {0}
        run: |
          import json, os, sys

          sa_raw = os.environ.get('GCP_SA_KEY', '').strip()
          if not sa_raw:
              print('::warning::GCP_SA_KEY no configurado todavía — se omite la sync.')
              sys.exit(0)

          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_info(
              json.loads(sa_raw),
              scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
          svc = build('sheets', 'v4', credentials=creds)
          sheet_id = os.environ['SHEET_ID']

          # Lee el nombre real de la primera pestaña (no asumir "Hoja 1").
          meta = svc.spreadsheets().get(spreadsheetId=sheet_id).execute()
          tab = meta['sheets'][0]['properties']['title']
          # Rango = pestaña entera (todas las columnas). NO acotar a A:R, porque
          # columnas nuevas como "Entidades RECEX" (col 19+) quedarían fuera.
          res = svc.spreadsheets().values().get(
              spreadsheetId=sheet_id, range=f"'{tab}'").execute()
          rows = res.get('values', [])
          if not rows:
              print('::error::El Sheet está vacío.')
              sys.exit(1)

          import re

          header = [h.strip() for h in rows[0]]
          idx = {name: i for i, name in enumerate(header)}

          def cell(r, name):
              i = idx.get(name)
              return (r[i].strip() if i is not None and i < len(r) and r[i] is not None else '')

          # Parseo robusto de coordenadas. Google Sheets en locale es-ES
          # interpreta el punto de "28.963861" como separador de miles y guarda
          # "28.963.861.220.964.800" (destrozo). Como las coords de Canarias y
          # Fuerteventura tienen SIEMPRE 2 dígitos de parte entera (lat 27-29,
          # lng 13-18), si el valor "limpio" no cae en rango lo reconstruimos
          # poniendo el decimal tras los 2 primeros dígitos. Acepta también
          # coma decimal y valores ya correctos.
          def parse_coord(raw):
              s = str(raw).strip().replace('\\', '')
              if not s:
                  return None
              neg = s.startswith('-')
              # 1) intento limpio: punto o coma decimal, pero NO separadores de miles
              if s.count('.') <= 1 and s.count(',') <= 1:
                  try:
                      v = float(s.replace(',', '.'))
                      if -180 <= v <= 180:
                          return v
                  except ValueError:
                      pass
              # 2) reconstrucción tras destrozo de locale
              digits = re.sub(r'\D', '', s)
              if not digits:
                  return None
              v = float(digits[:2] + '.' + digits[2:]) if len(digits) > 2 else float(digits)
              return -v if neg else v

          # Columnas que NUNCA son filtro (identidad, texto libre, contacto, coords).
          # Todo lo demás (incluidas columnas que se añadan en el futuro) se vuelca
          # en props._filters y el mapa genera un filtro por cada una automáticamente.
          FILTER_BLOCKLIST = {
              'ID', 'Nombre', 'Dirección', 'Latitud', 'Longitud',
              'Teléfonos', 'Emails', 'Web', 'Facebook', 'Instagram', 'Twitter', 'Logo ID',
          }

          # Rango duro del archipiélago (el mismo de scripts/geo_checks.py). Una
          # coordenada "válida" globalmente pero fuera de Canarias (Madrid, mar
          # abierto, swap lat/lng...) es un error de datos: no se publica.
          def in_canarias(lat, lng):
              return 27.3 <= lat <= 29.6 and -18.6 <= lng <= -13.2

          # Typos conocidos de la columna Municipio (clave en minúsculas y sin
          # acentos). Se normalizan aquí para que el filtro del mapa no muestre
          # el mismo municipio duplicado; el Sheet debe corregirse igualmente.
          import unicodedata
          MUNI_ALIASES = {
              'puerto la cruz': 'Puerto de la Cruz',
          }
          def norm_key(s):
              s = unicodedata.normalize('NFD', s.lower())
              return ''.join(c for c in s if unicodedata.category(c) != 'Mn').strip()
          def fix_muni(s):
              return MUNI_ALIASES.get(norm_key(s), s)

          features, skipped = [], []
          for r in rows[1:]:
              if not any(c.strip() for c in r):
                  continue  # fila vacía
              lat, lng = parse_coord(cell(r, 'Latitud')), parse_coord(cell(r, 'Longitud'))
              if lat is None or lng is None or not in_canarias(lat, lng):
                  skipped.append(cell(r, 'Nombre') or '(sin nombre)')
                  continue
              split = lambda s: [x.strip() for x in s.split(';') if x.strip()]
              props = {
                  'id': cell(r, 'ID'),
                  'name': cell(r, 'Nombre'),
                  'sector': cell(r, 'Sector'),
                  'typology': cell(r, 'Tipología'),
                  'protagonist': cell(r, 'Protagonista'),
                  'url': cell(r, 'Web'),
                  'instagram': cell(r, 'Instagram'),
                  'facebook': cell(r, 'Facebook'),
                  'twitter': cell(r, 'Twitter'),
                  'address': cell(r, 'Dirección'),
                  'municipality': fix_muni(cell(r, 'Municipio')),
                  'province': cell(r, 'Provincia'),
                  'phones': split(cell(r, 'Teléfonos')),
                  'emails': split(cell(r, 'Emails')),
                  'island': cell(r, 'Isla'),
                  'logo': cell(r, 'Logo ID'),
              }
              # Dimensiones de filtro: cada columna no bloqueada, con su nombre
              # humano tal cual en el Sheet. El mapa decide cuáles mostrar según
              # cardinalidad. Añadir una columna en el Sheet → nuevo filtro, sin tocar código.
              filters = {}
              for col in header:
                  if col in FILTER_BLOCKLIST:
                      continue
                  v = cell(r, col)
                  if v:
                      filters[col] = fix_muni(v) if col == 'Municipio' else v
              props['_filters'] = filters
              features.append({
                  'type': 'Feature',
                  'geometry': {'type': 'Point', 'coordinates': [lng, lat]},
                  'properties': props,
              })

          if not features:
              print('::error::Ninguna fila con coordenadas válidas — no se sobrescribe el geojson.')
              sys.exit(1)

          fc = {'type': 'FeatureCollection', 'features': features}
          with open('entities.geojson', 'w', encoding='utf-8') as fh:
              json.dump(fc, fh, ensure_ascii=False, separators=(', ', ': '))
          print(f'{len(features)} entidades escritas, {len(skipped)} descartadas por coords.')
          for name in skipped:
              print(f'::warning::Fila descartada (sin coordenadas válidas en Canarias): {name}')

      # Validación geográfica (no bloquea el sync): coordenadas en el mar,
      # isla/municipio declarados que no coinciden con el punto, typos de
      # municipio... El resumen sale en la página del run para que el equipo
      # vea qué corregir en el Sheet.
      - name: Informe de calidad de datos
        if: always()
        run: |
          if [ -f entities.geojson ]; then
            python3 scripts/geo_checks.py entities.geojson --summary >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commitear si hay cambios
        run: |
          if git diff --quiet entities.geojson; then
            echo "Sin cambios en entities.geojson."
          else
            git config user.name "Diego Alegil"
            git config user.email "diegoalegil@users.noreply.github.com"
            git add entities.geojson
            git commit -m "Sync: actualizar entities.geojson desde el Sheet ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "entities.geojson actualizado y commiteado."
          fi
