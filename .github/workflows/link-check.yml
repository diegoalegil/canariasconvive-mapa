name: Link check entities.geojson

on:
  schedule:
    # Cada lunes a las 06:00 UTC (07:00 Madrid en invierno, 08:00 en verano).
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'entities.geojson'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit URLs in entities.geojson
        id: audit
        env:
          # Solo falla el job si hay más de N hard fails. Algunos servidores
          # de ONG dan timeout intermitente desde la IP de GitHub Actions
          # aunque estén vivos en navegador; no queremos ruido constante.
          HARD_FAIL_THRESHOLD: '5'
        shell: python {0}
        run: |
          import json, os, ssl, sys, urllib.error, urllib.request, socket
          from concurrent.futures import ThreadPoolExecutor
          ctx = ssl._create_unverified_context()
          d = json.load(open('entities.geojson'))
          urls = {}
          for f in d['features']:
              p = f['properties']
              for k in ('url', 'facebook', 'instagram', 'twitter'):
                  u = (p.get(k) or '').strip()
                  if u.startswith(('http://', 'https://')):
                      urls.setdefault(u, []).append(p['name'])

          def check(u):
              for method in ('HEAD', 'GET'):
                  try:
                      req = urllib.request.Request(u, method=method, headers={
                          'User-Agent': 'Mozilla/5.0 (link-audit; +github.com/diegoalegil/canariasconvive-mapa)'
                      })
                      with urllib.request.urlopen(req, timeout=10, context=ctx) as r:
                          return u, r.status, None
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 405) and method == 'HEAD':
                          continue
                      return u, e.code, None
                  except (socket.timeout, urllib.error.URLError, ConnectionResetError, OSError) as e:
                      if method == 'HEAD':
                          continue
                      return u, None, type(e).__name__
                  except Exception as e:
                      return u, None, type(e).__name__
              return u, None, 'unreachable'

          results = []
          with ThreadPoolExecutor(max_workers=20) as pool:
              results.extend(pool.map(check, urls))

          # Soft fails: códigos transitorios + hosts antibot conocidos.
          SOFT_CODES = {403, 405, 429, 999}
          ANTIBOT_HOSTS = ('instagram.com', 'facebook.com', 'linkedin.com', 'x.com', 'twitter.com')
          # Sitios vivos desde navegador pero que rechazan las IPs de los
          # runners de GitHub Actions (firewall / WAF / geo). Se tratan como
          # soft fail para no ensuciar el reporte semanal.
          GEO_BLOCKED_HOSTS = ('casafrica.es', 'iass.es', 'uerca.org')
          hard, soft, ok = [], [], 0
          for u, code, err in results:
              if code and 200 <= code < 400:
                  ok += 1
              elif code in SOFT_CODES or (code and 500 <= code < 600):
                  soft.append((u, code, err))
              elif any(h in u for h in ANTIBOT_HOSTS + GEO_BLOCKED_HOSTS):
                  soft.append((u, code, err))
              else:
                  hard.append((u, code, err))

          # Construye el reporte tanto para stdout (visible en logs) como para
          # GitHub Step Summary (visible directamente en la pestaña Actions).
          lines = []
          lines.append(f"## URL audit ({len(urls)} URLs únicas)")
          lines.append("")
          lines.append(f"- ✅ OK: **{ok}**")
          lines.append(f"- ⚠️ Soft fail (antibot/rate-limit/5xx, transient): **{len(soft)}**")
          lines.append(f"- ❌ Hard fail (4xx no-403 / DNS / timeout): **{len(hard)}**")
          if hard:
              lines.append("")
              lines.append("### Hard failures")
              for u, code, err in sorted(hard, key=lambda x: str(x[1] or x[2] or '')):
                  ents = ', '.join(urls[u][:2])
                  lines.append(f"- `[{code or err}]` {u} — {ents}")
          if soft:
              lines.append("")
              lines.append("<details><summary>Soft failures ({} URLs)</summary>".format(len(soft)))
              lines.append("")
              for u, code, err in sorted(soft, key=lambda x: str(x[1] or '')):
                  ents = ', '.join(urls[u][:2])
                  lines.append(f"- `[{code or err}]` {u} — {ents}")
              lines.append("</details>")

          report = "\n".join(lines)
          print(report)
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as fh:
                  fh.write(report + "\n")

          # Solo falla si superamos el umbral configurable de hard fails.
          # Un par de timeouts no debería romper main todos los lunes.
          threshold = int(os.environ.get('HARD_FAIL_THRESHOLD', '25'))
          if len(hard) > threshold:
              print(f"\n::error::{len(hard)} hard failures > umbral {threshold}")
              sys.exit(1)
